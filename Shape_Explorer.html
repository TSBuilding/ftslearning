<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shape Explorer — FTS Learning HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1729;
    --card: #1e2d4a;
    --card2: #243459;
    --border: rgba(255,255,255,0.08);
    --text: #f0f4ff;
    --muted: #94a3b8;
    --gold: #f59e0b;
    --gold-light: #fde68a;
    --blue: #3b82f6;
    --blue-deep: #2563eb;
    --green: #16a34a;
    --green-light: #4ade80;
    --red: #dc2626;
    --red-light: #f87171;
    --purple: #a78bfa;
    --teal: #2dd4bf;
    --orange: #fb923c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100%;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(45,212,191,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(59,130,246,0.06) 0%, transparent 55%);
    pointer-events: none; z-index: 0;
  }

  .wrapper {
    position: relative; z-index: 1;
    max-width: 600px; margin: 0 auto;
    padding: 16px 16px 48px;
    display: flex; flex-direction: column; gap: 16px;
  }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .back-btn {
    background: var(--card); border: none; color: var(--muted);
    font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;
    padding: 8px 16px; border-radius: 20px; cursor: pointer;
    text-decoration: none; transition: all 0.2s; flex-shrink: 0;
  }
  .back-btn:hover { background: var(--card2); color: var(--text); }
  .title-block { text-align: center; flex: 1; }
  .title-block h1 { font-family: 'Fredoka One', cursive; font-size: 22px; color: var(--teal); letter-spacing: 1px; line-height: 1; }
  .title-block p { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 2px; }

  .mute-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-size: 18px;
    width: 38px; height: 38px; border-radius: 12px;
    cursor: pointer; transition: all 0.2s; flex-shrink: 0;
  }
  .mute-btn:hover { background: var(--card2); }
  .mute-btn.muted { color: var(--red-light); border-color: rgba(220,38,38,0.3); }

  /* SCREENS */
  .screen { display: none; flex-direction: column; gap: 16px; }
  .screen.active { display: flex; }

  /* ═════════ START SCREEN ═════════ */
  .start-hero {
    background: var(--card);
    border-radius: 24px;
    padding: 32px 24px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    text-align: center;
  }
  .start-icon { font-size: 56px; animation: bob 2.5s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .start-title { font-family: 'Fredoka One', cursive; font-size: 22px; color: var(--text); line-height: 1.3; }
  .start-title span { color: var(--teal); }
  .start-sub { font-size: 14px; color: var(--muted); font-weight: 600; line-height: 1.5; }

  /* Shape gallery preview on start screen */
  .shape-gallery { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 4px; }
  .gallery-item {
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card2); border-radius: 12px;
    border: 1px solid var(--border);
  }
  .gallery-item svg { width: 38px; height: 38px; }

  .start-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--teal), #0d9488);
    border: none; color: #04201c;
    font-family: 'Fredoka One', cursive; font-size: 22px;
    padding: 18px; border-radius: 16px;
    cursor: pointer; letter-spacing: 0.5px;
    box-shadow: 0 4px 20px rgba(45,212,191,0.35);
    transition: all 0.2s;
  }
  .start-btn:hover { transform: scale(1.02); }

  .best-pill {
    background: var(--card2); border-radius: 12px;
    padding: 8px 16px; font-size: 13px; font-weight: 700;
    color: var(--gold);
  }

  /* ═════════ GAME SCREEN ═════════ */
  .game-hud { display: flex; flex-direction: column; gap: 8px; }
  .hud-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hud-label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.5px; }
  .score-pill {
    background: var(--card); border: 1px solid rgba(245,158,11,0.3);
    border-radius: 14px; padding: 5px 12px;
    font-family: 'Fredoka One', cursive; font-size: 14px; color: var(--gold);
  }
  .progress-wrap { width: 100%; background: var(--card); border-radius: 20px; height: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--blue)); border-radius: 20px; transition: width 0.4s ease; width: 0%; }

  .play-card {
    background: var(--card);
    border-radius: 24px;
    padding: 26px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .question-text {
    font-family: 'Fredoka One', cursive;
    font-size: 21px; color: var(--text);
    text-align: center; line-height: 1.3;
  }
  .question-text .hl { color: var(--teal); }

  /* Shape display */
  .shape-stage {
    display: flex; align-items: center; justify-content: center;
    min-height: 170px; width: 100%;
  }
  .shape-stage svg { width: 150px; height: 150px; }
  .poly { fill: var(--card2); stroke: var(--teal); stroke-width: 5; stroke-linejoin: round; }
  .poly.accent { stroke: var(--orange); }

  /* For "pick the shape" questions — a row of small shapes */
  .shape-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
  .shape-option {
    background: var(--card2); border: 2px solid var(--border);
    border-radius: 16px; padding: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s;
  }
  .shape-option svg { width: 70px; height: 70px; }
  .shape-option:hover { border-color: var(--teal); transform: translateY(-2px); }
  .shape-option.correct { background: rgba(22,163,74,0.2); border-color: var(--green); }
  .shape-option.wrong   { background: rgba(220,38,38,0.2); border-color: var(--red); }
  .shape-option .poly { stroke: var(--text); fill: rgba(255,255,255,0.06); }
  .shape-option.correct .poly { stroke: var(--green-light); }
  .shape-option.wrong .poly { stroke: var(--red-light); }

  /* text/number answer choices */
  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
  .choices.three { grid-template-columns: repeat(3, 1fr); }
  .choice-btn {
    background: var(--card2); border: 2px solid var(--border);
    border-radius: 14px; padding: 16px 8px;
    font-family: 'Fredoka One', cursive; font-size: 18px; color: var(--text);
    cursor: pointer; transition: all 0.15s;
  }
  .choice-btn:hover { border-color: var(--teal); transform: translateY(-2px); }
  .choice-btn.correct { background: rgba(22,163,74,0.2); border-color: var(--green); color: var(--green-light); }
  .choice-btn.wrong   { background: rgba(220,38,38,0.2); border-color: var(--red); color: var(--red-light); }
  .choice-btn:disabled { cursor: default; }

  /* feedback (this is where the LEARNING happens) */
  .feedback {
    width: 100%; border-radius: 16px; padding: 16px 18px;
    display: none; flex-direction: column; gap: 10px;
    border: 2px solid transparent;
    animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn { from{transform:scale(0.85);opacity:0} to{transform:scale(1);opacity:1} }
  .feedback.good { display: flex; border-color: var(--green); background: rgba(22,163,74,0.1); }
  .feedback.bad  { display: flex; border-color: var(--gold); background: rgba(245,158,11,0.08); }
  .fb-top { display: flex; align-items: center; gap: 10px; }
  .fb-emoji { font-size: 24px; flex-shrink: 0; }
  .fb-headline { font-size: 15px; font-weight: 800; flex: 1; }
  .feedback.good .fb-headline { color: var(--green-light); }
  .feedback.bad  .fb-headline { color: var(--gold-light); }

  /* the fact panel — always shown, this is the teaching */
  .fact-panel {
    background: rgba(45,212,191,0.06);
    border: 1px solid rgba(45,212,191,0.25);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex; gap: 12px; align-items: center;
  }
  .fact-shape { flex-shrink: 0; }
  .fact-shape svg { width: 50px; height: 50px; }
  .fact-shape .poly { stroke: var(--teal); stroke-width: 6; fill: rgba(45,212,191,0.1); }
  .fact-text { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.45; }
  .fact-text strong { color: var(--teal); }
  .fact-facts { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .fb-next {
    width: 100%;
    background: var(--card2); border: 2px solid rgba(255,255,255,0.1);
    color: var(--text); font-family: 'Fredoka One', cursive;
    font-size: 16px; padding: 12px; border-radius: 12px;
    cursor: pointer; transition: all 0.2s;
  }
  .fb-next:hover { background: #2d3f60; }

  /* ═════════ RESULTS ═════════ */
  .results-card {
    background: var(--card); border-radius: 24px; padding: 32px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    border: 1px solid var(--border);
  }
  .results-emoji { font-size: 64px; animation: bob 2s ease-in-out infinite; }
  .results-title { font-family: 'Fredoka One', cursive; font-size: 24px; color: var(--teal); }
  .results-score { font-family: 'Fredoka One', cursive; font-size: 48px; color: white; line-height: 1; }
  .results-score span { font-size: 22px; color: var(--muted); }
  .results-msg { font-size: 14px; color: var(--muted); font-weight: 700; line-height: 1.4; }
  .results-best { background: var(--card2); border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 700; color: var(--gold); }
  .results-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .action-btn {
    border: none; border-radius: 14px; padding: 14px;
    font-family: 'Fredoka One', cursive; font-size: 15px;
    cursor: pointer; transition: all 0.2s;
  }
  .action-btn.primary { background: linear-gradient(135deg, var(--teal), #0d9488); color: #04201c; }
  .action-btn.primary:hover { transform: scale(1.02); }
  .action-btn.ghost { background: var(--card); border: 2px solid var(--border); color: var(--text); }
  .action-btn.ghost:hover { background: var(--card2); }

  .confetti-piece { position: fixed; pointer-events: none; z-index: 999; border-radius: 2px; animation: cfall linear forwards; }
  @keyframes cfall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <a href="index.html" class="back-btn" id="header-back-btn">← Home</a>
    <div class="title-block">
      <h1>🔷 Shape Explorer</h1>
      <p>FTS Learning HQ</p>
    </div>
    <button class="mute-btn" id="mute-btn" title="Sound on/off">🔊</button>
  </div>

  <!-- START SCREEN -->
  <div id="start-screen" class="screen active">
    <div class="start-hero">
      <div class="start-icon">🔷</div>
      <div class="start-title">Become a <span>Shape Master</span>, FTS!</div>
      <div class="start-sub">Learn the shapes, their sides and corners, and what they look like in real life — as you play!</div>
      <div class="shape-gallery" id="shape-gallery"></div>
      <div class="best-pill" id="best-pill" style="display:none"></div>
    </div>
    <button class="start-btn" id="start-btn">🚀 Start Exploring!</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div class="game-hud">
      <div class="hud-row">
        <div class="hud-label" id="q-counter">Question 1 of 10</div>
        <div class="score-pill" id="score-pill">⭐ 0 / 10</div>
      </div>
      <div class="progress-wrap"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="play-card">
      <div class="question-text" id="question-text"></div>
      <div id="visual-area" style="width:100%;"></div>
      <div id="controls-area" style="width:100%;"></div>
      <div class="feedback" id="feedback">
        <div class="fb-top">
          <div class="fb-emoji" id="fb-emoji"></div>
          <div class="fb-headline" id="fb-headline"></div>
        </div>
        <div class="fact-panel" id="fact-panel">
          <div class="fact-shape" id="fact-shape"></div>
          <div>
            <div class="fact-text" id="fact-text"></div>
            <div class="fact-facts" id="fact-facts"></div>
          </div>
        </div>
        <button class="fb-next" id="fb-next">Next →</button>
      </div>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="screen">
    <div class="results-card">
      <div class="results-emoji" id="res-emoji">🏆</div>
      <div class="results-title" id="res-title">Shape Master!</div>
      <div class="results-score" id="res-score">0 <span>/ 10</span></div>
      <div class="results-msg" id="res-msg"></div>
      <div class="results-best" id="res-best" style="display:none"></div>
    </div>
    <div class="results-actions">
      <button class="action-btn ghost" id="res-home">🏠 HQ</button>
      <button class="action-btn primary" id="res-again">🔄 Play Again</button>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// SHAPE DATA
// ═══════════════════════════════════════════════════════════════════════
// Each shape: name, sides, corners, equalSides (true/false/null for circle),
// realLife anchor, and an SVG generator.
const SHAPES = {
  circle: {
    name: 'circle', sides: 0, corners: 0, equalSides: null,
    realLife: 'a clock or a ball',
    svg: (cls) => `<svg viewBox="0 0 120 120"><circle class="${cls}" cx="60" cy="60" r="50"/></svg>`,
    factText: (s) => `A <strong>circle</strong> is one smooth curve — no straight sides and no corners! It's round like ${s.realLife}.`,
  },
  triangle: {
    name: 'triangle', sides: 3, corners: 3, equalSides: true,
    realLife: 'a slice of pizza or a roof',
    svg: (cls) => `<svg viewBox="0 0 120 120"><polygon class="${cls}" points="60,12 108,104 12,104"/></svg>`,
    factText: (s) => `A <strong>triangle</strong> has <strong>3 sides</strong> and <strong>3 corners</strong> — like ${s.realLife}.`,
  },
  square: {
    name: 'square', sides: 4, corners: 4, equalSides: true,
    realLife: 'a window or a cracker',
    svg: (cls) => `<svg viewBox="0 0 120 120"><rect class="${cls}" x="16" y="16" width="88" height="88" rx="3"/></svg>`,
    factText: (s) => `A <strong>square</strong> has <strong>4 sides</strong> that are all the <strong>same length</strong>, and 4 corners — like ${s.realLife}.`,
  },
  rectangle: {
    name: 'rectangle', sides: 4, corners: 4, equalSides: false,
    realLife: 'a door or a footy field',
    svg: (cls) => `<svg viewBox="0 0 120 120"><rect class="${cls}" x="8" y="30" width="104" height="60" rx="3"/></svg>`,
    factText: (s) => `A <strong>rectangle</strong> has <strong>4 corners</strong> like a square, but two long sides and two short sides — like ${s.realLife}.`,
  },
  pentagon: {
    name: 'pentagon', sides: 5, corners: 5, equalSides: true,
    realLife: 'a house shape or a soccer ball patch',
    svg: (cls) => `<svg viewBox="0 0 120 120"><polygon class="${cls}" points="60,10 106,44 88,100 32,100 14,44"/></svg>`,
    factText: (s) => `A <strong>pentagon</strong> has <strong>5 sides</strong> and <strong>5 corners</strong> — like ${s.realLife}.`,
  },
  hexagon: {
    name: 'hexagon', sides: 6, corners: 6, equalSides: true,
    realLife: 'a honeycomb',
    svg: (cls) => `<svg viewBox="0 0 120 120"><polygon class="${cls}" points="60,10 102,35 102,85 60,110 18,85 18,35"/></svg>`,
    factText: (s) => `A <strong>hexagon</strong> has <strong>6 sides</strong> and <strong>6 corners</strong> — like ${s.realLife}.`,
  },
};
const SHAPE_KEYS = Object.keys(SHAPES);

// ═══════════════════════════════════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════════════════════════════════
const QUESTIONS_PER_SESSION = 10;
let questions = [];
let qIdx = 0;
let score = 0;
let answered = false;
let muted = false;

// ═══════════════════════════════════════════════════════════════════════
// VOICE
// ═══════════════════════════════════════════════════════════════════════
let voiceCache = null;
function loadVoices() {
  if (typeof speechSynthesis === 'undefined') return;
  const v = speechSynthesis.getVoices();
  voiceCache = v.find(x => x.name === 'Karen') || v.find(x => x.lang === 'en-AU')
            || v.find(x => x.lang && x.lang.startsWith('en')) || v[0] || null;
}
if (typeof speechSynthesis !== 'undefined') { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function say(t) {
  if (muted || typeof speechSynthesis === 'undefined') return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  if (voiceCache) u.voice = voiceCache;
  u.rate = 0.85; u.pitch = 1.05; u.lang = 'en-AU';
  speechSynthesis.speak(u);
}
muted = localStorage.getItem('shape_muted') === '1';
const muteBtn = document.getElementById('mute-btn');
function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; muteBtn.classList.toggle('muted', muted); }
refreshMute();
muteBtn.addEventListener('click', () => {
  muted = !muted; localStorage.setItem('shape_muted', muted ? '1' : '0');
  if (muted && typeof speechSynthesis !== 'undefined') speechSynthesis.cancel();
  refreshMute();
});

// ═══════════════════════════════════════════════════════════════════════
// PERSONAL BEST
// ═══════════════════════════════════════════════════════════════════════
function getBest() { const v = localStorage.getItem('shape_best'); return v ? parseInt(v,10) : null; }
function setBest(s) { const c = getBest(); if (c === null || s > c) { localStorage.setItem('shape_best', s); return true; } return false; }
function refreshBestPill() {
  const b = getBest();
  const pill = document.getElementById('best-pill');
  if (b !== null) { pill.style.display = 'block'; pill.textContent = `🏆 Best: ${b}/${QUESTIONS_PER_SESSION}`; }
}
refreshBestPill();

// ═══════════════════════════════════════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════════════════════════════════════
function showScreen(name) {
  ['start-screen','game-screen','results-screen'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === name);
  });
  updateBackBtn();
}

// ═══════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

// ═══════════════════════════════════════════════════════════════════════
// POPULATE START GALLERY
// ═══════════════════════════════════════════════════════════════════════
(function fillGallery(){
  const g = document.getElementById('shape-gallery');
  SHAPE_KEYS.forEach(k => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = SHAPES[k].svg('poly');
    g.appendChild(item);
  });
})();

// ═══════════════════════════════════════════════════════════════════════
// QUESTION GENERATION
// ═══════════════════════════════════════════════════════════════════════
// Four question types:
//   'name'    — show a shape, "what shape is this?" (pick name)
//   'sides'   — show a shape, "how many sides?" (pick number)
//   'corners' — show a shape, "how many corners?" (pick number)
//   'pick'    — "which one is a hexagon?" (pick shape from options)
// Circle is excluded from 'sides'/'corners' counting questions (0 is a weird
// answer to quiz) but included in 'name' and 'pick'.

function buildSession() {
  questions = [];
  const types = ['name','sides','corners','pick'];
  // Ensure a spread: cycle through types, random shape each time.
  for (let i = 0; i < QUESTIONS_PER_SESSION; i++) {
    const type = types[i % types.length];
    let shapeKey;
    if (type === 'sides' || type === 'corners') {
      // exclude circle from counting questions
      shapeKey = pick(SHAPE_KEYS.filter(k => k !== 'circle'));
    } else {
      shapeKey = pick(SHAPE_KEYS);
    }
    questions.push({ type, shapeKey });
  }
  questions = shuffle(questions);
  qIdx = 0; score = 0;
}

// ═══════════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════════
function renderQuestion() {
  answered = false;
  const q = questions[qIdx];
  const shape = SHAPES[q.shapeKey];
  const qText = document.getElementById('question-text');
  const visual = document.getElementById('visual-area');
  const controls = document.getElementById('controls-area');
  visual.innerHTML = ''; controls.innerHTML = '';
  document.getElementById('feedback').className = 'feedback';

  document.getElementById('q-counter').textContent = `Question ${qIdx+1} of ${QUESTIONS_PER_SESSION}`;
  document.getElementById('score-pill').textContent = `⭐ ${score} / ${QUESTIONS_PER_SESSION}`;
  document.getElementById('progress-fill').style.width = `${(qIdx/QUESTIONS_PER_SESSION)*100}%`;

  if (q.type === 'name')         renderName(q, shape, qText, visual, controls);
  else if (q.type === 'sides')   renderCount(q, shape, qText, visual, controls, 'sides');
  else if (q.type === 'corners') renderCount(q, shape, qText, visual, controls, 'corners');
  else                           renderPick(q, shape, qText, visual, controls);
}

function renderName(q, shape, qText, visual, controls) {
  qText.innerHTML = `What <span class="hl">shape</span> is this?`;
  visual.innerHTML = `<div class="shape-stage">${shape.svg('poly')}</div>`;
  say('What shape is this?');

  const correct = shape.name;
  const options = new Set([correct]);
  while (options.size < 4) options.add(SHAPES[pick(SHAPE_KEYS)].name);
  const grid = document.createElement('div');
  grid.className = 'choices';
  shuffle([...options]).forEach(opt => {
    const b = document.createElement('button');
    b.className = 'choice-btn'; b.style.textTransform = 'capitalize'; b.textContent = opt;
    b.addEventListener('click', () => {
      if (answered) return;
      const ok = opt === correct;
      grid.querySelectorAll('.choice-btn').forEach(x => x.disabled = true);
      b.classList.add(ok ? 'correct' : 'wrong');
      if (!ok) [...grid.children].find(c => c.textContent === correct)?.classList.add('correct');
      finish(ok, shape, ok ? `Yes — it's a ${correct}!` : `It's a ${correct}.`);
    });
    grid.appendChild(b);
  });
  controls.appendChild(grid);
}

function renderCount(q, shape, qText, visual, controls, which) {
  const label = which === 'sides' ? 'sides' : 'corners';
  qText.innerHTML = `How many <span class="hl">${label}</span> does this shape have?`;
  visual.innerHTML = `<div class="shape-stage">${shape.svg('poly')}</div>`;
  say(`How many ${label} does this shape have?`);

  const correct = which === 'sides' ? shape.sides : shape.corners;
  const options = new Set([correct]);
  while (options.size < 3) {
    const cand = correct + pick([-2,-1,1,2]);
    if (cand >= 3) options.add(cand);
  }
  const grid = document.createElement('div');
  grid.className = 'choices three';
  shuffle([...options]).forEach(n => {
    const b = document.createElement('button');
    b.className = 'choice-btn'; b.textContent = n;
    b.addEventListener('click', () => {
      if (answered) return;
      const ok = n === correct;
      grid.querySelectorAll('.choice-btn').forEach(x => x.disabled = true);
      b.classList.add(ok ? 'correct' : 'wrong');
      if (!ok) [...grid.children].find(c => c.textContent == correct)?.classList.add('correct');
      finish(ok, shape,
        ok ? `Yes — a ${shape.name} has ${correct} ${label}!`
           : `A ${shape.name} has ${correct} ${label}.`);
    });
    grid.appendChild(b);
  });
  controls.appendChild(grid);
}

function renderPick(q, shape, qText, visual, controls) {
  qText.innerHTML = `Which one is a <span class="hl">${shape.name}</span>?`;
  say(`Which one is a ${shape.name}?`);

  const correctKey = q.shapeKey;
  const options = new Set([correctKey]);
  while (options.size < 4) options.add(pick(SHAPE_KEYS));
  const grid = document.createElement('div');
  grid.className = 'shape-options';
  shuffle([...options]).forEach(key => {
    const opt = document.createElement('div');
    opt.className = 'shape-option';
    opt.dataset.key = key;
    opt.innerHTML = SHAPES[key].svg('poly');
    opt.addEventListener('click', () => {
      if (answered) return;
      const ok = key === correctKey;
      grid.querySelectorAll('.shape-option').forEach(x => x.style.pointerEvents = 'none');
      opt.classList.add(ok ? 'correct' : 'wrong');
      if (!ok) {
        const right = grid.querySelector(`.shape-option[data-key="${correctKey}"]`);
        if (right) right.classList.add('correct');
      }
      finish(ok, shape, ok ? `Yes — that's a ${shape.name}!` : `That one's the ${shape.name}.`);
    });
    grid.appendChild(opt);
  });
  controls.appendChild(grid);
}

// ═══════════════════════════════════════════════════════════════════════
// FINISH — show feedback + the teaching fact (the "learn as you test" bit)
// ═══════════════════════════════════════════════════════════════════════
function finish(correct, shape, headline) {
  answered = true;
  if (correct) { score++; confetti(12); }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (correct ? 'good' : 'bad');
  document.getElementById('fb-emoji').textContent = correct ? pick(['🌟','🎉','⭐','✨','🏆']) : '💡';
  document.getElementById('fb-headline').textContent = headline;

  // The fact panel always teaches, win or lose
  document.getElementById('fact-shape').innerHTML = shape.svg('poly');
  document.getElementById('fact-text').innerHTML = shape.factText(shape);

  // Build a quick facts line
  let facts;
  if (shape.name === 'circle') {
    facts = '0 straight sides · 0 corners · round all the way';
  } else {
    const eq = shape.equalSides ? 'all sides equal' : 'sides not all equal';
    facts = `${shape.sides} sides · ${shape.corners} corners · ${eq}`;
  }
  document.getElementById('fact-facts').textContent = facts;

  document.getElementById('score-pill').textContent = `⭐ ${score} / ${QUESTIONS_PER_SESSION}`;

  // Voice teaches the fact (strip HTML tags)
  const spoken = shape.factText(shape).replace(/<[^>]+>/g, '');
  say(spoken);
}

document.getElementById('fb-next').addEventListener('click', () => {
  qIdx++;
  if (qIdx >= QUESTIONS_PER_SESSION) showResults();
  else renderQuestion();
});

// ═══════════════════════════════════════════════════════════════════════
// RESULTS
// ═══════════════════════════════════════════════════════════════════════
function showResults() {
  document.getElementById('progress-fill').style.width = '100%';
  showScreen('results-screen');
  const total = QUESTIONS_PER_SESSION;
  const pct = score/total;
  let emoji, title, msg;
  if (score === total)   { emoji='🏆'; title='Shape Master!'; msg='Every single one correct — amazing!'; confetti(40); setTimeout(()=>confetti(30),400); }
  else if (pct >= 0.8)   { emoji='🌟'; title='Brilliant!'; msg=`${score} out of ${total} — you really know your shapes!`; }
  else if (pct >= 0.6)   { emoji='⭐'; title='Great effort!'; msg=`${score} out of ${total} — getting better every time!`; }
  else if (pct >= 0.4)   { emoji='💪'; title='Good try!'; msg=`${score} out of ${total} — keep exploring!`; }
  else                   { emoji='📚'; title='Keep going!'; msg='Have another go — you\'ll get there!'; }

  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-score').innerHTML = `${score} <span>/ ${total}</span>`;
  document.getElementById('res-msg').textContent = msg;

  const isNew = setBest(score);
  const best = getBest();
  const bestEl = document.getElementById('res-best');
  if (isNew) { bestEl.style.display='block'; bestEl.textContent = `⭐ New personal best: ${best}/${total}!`; setTimeout(()=>confetti(20),200); }
  else if (best !== null) { bestEl.style.display='block'; bestEl.textContent = `Personal best: ${best}/${total}`; }
  refreshBestPill();
  say(title + ' ' + msg);
}

// ═══════════════════════════════════════════════════════════════════════
// BUTTONS
// ═══════════════════════════════════════════════════════════════════════
function startGame() { buildSession(); showScreen('game-screen'); renderQuestion(); }
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('res-again').addEventListener('click', startGame);
document.getElementById('res-home').addEventListener('click', () => { window.location.href = 'index.html'; });

// ═══════════════════════════════════════════════════════════════════════
// HEADER BACK BUTTON
// ═══════════════════════════════════════════════════════════════════════
const headerBackBtn = document.getElementById('header-back-btn');
function updateBackBtn() {
  const onStart = document.getElementById('start-screen').classList.contains('active');
  headerBackBtn.textContent = onStart ? '← Home' : '← Back';
}
headerBackBtn.addEventListener('click', e => {
  const onStart = document.getElementById('start-screen').classList.contains('active');
  if (!onStart) { e.preventDefault(); if (typeof speechSynthesis!=='undefined') speechSynthesis.cancel(); showScreen('start-screen'); }
});
updateBackBtn();

// ═══════════════════════════════════════════════════════════════════════
// CONFETTI
// ═══════════════════════════════════════════════════════════════════════
function confetti(count) {
  const colors = ['#2dd4bf','#3b82f6','#f59e0b','#16a34a','#a78bfa','#fb923c'];
  for (let i=0;i<count;i++){
    setTimeout(()=>{
      const p=document.createElement('div'); p.className='confetti-piece';
      p.style.cssText=`left:${Math.random()*100}vw;top:-10px;width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2}s;transform:rotate(${Math.random()*360}deg)`;
      document.body.appendChild(p); setTimeout(()=>p.remove(),4000);
    }, i*40);
  }
}

// INIT
showScreen('start-screen');
</script>
